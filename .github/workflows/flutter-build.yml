name: Flutter Build Printer GUI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      linux_gtk_variant:
        description: Linux runner variant for desktop packaging jobs
        required: false
        default: gtk3
        type: choice
        options:
          - gtk3
          - gtk4
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release_tag:
    name: Validate release tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      is_semver: ${{ steps.validate.outputs.is_semver }}
    steps:
      - id: validate
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            echo "Skipping release: $GITHUB_REF_NAME is not a valid v-prefixed SemVer tag."
          fi

  android:
    name: Android APK
    runs-on: [ubuntu-latest]
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Git describe
        id: ghd
        shell: bash
        run: |
          echo "tag=$(git describe --always --tags --dirty)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -qO /tmp/android-cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-cmdline-tools.zip -d /tmp/android-cmdline-tools
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv /tmp/android-cmdline-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager may exit early after consuming enough input, which causes
          # `yes` to receive SIGPIPE (141). Ignore that expected pipeline status.
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-36" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          test -f "$ANDROID_SDK_ROOT/platforms/android-37.0/android.jar"

          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Flutter Android SDK path
        run: flutter config --android-sdk "$ANDROID_SDK_ROOT"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Android (release APK)
        run: flutter build apk --release

      - name: Stage artifacts with LICENSE
        run: |
          mkdir -p artifacts/android
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/android/app-release-$SEMVER.apk"
          cp LICENSE artifacts/android/

      - name: Stage Android release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/android/app-release-${{ env.SEMVER }}.apk
          if-no-files-found: error

      - name: Upload Android artifact bundle
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-android-apk
          version: ${{ env.SEMVER }}
          filename: boomprint-android-apk
          append-max-detail-suffix: true
          path: artifacts/android/**
          retention-days: 7

  linux:
    name: Linux x64
    runs-on: [ubuntu-latest]
    env:
      LINUX_GTK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_gtk_variant || 'gtk3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Git describe
        id: ghd
        shell: bash
        run: |
          echo "tag=$(git describe --always --tags --dirty)" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libgtk-4-dev liblzma-dev libmimalloc-dev libpulse-dev libsecret-1-dev libssl-dev curl git unzip xz-utils zip libglu1-mesa pkg-config libstdc++-12-dev libasound2-dev mpv libmpv-dev software-properties-common lld llvm
          sudo apt-get install -y mpv squashfs-tools patchelf desktop-file-utils zsync

          # Some Flutter/Dart toolchains look for linker binaries under llvm-18 path.
          # Provide compatibility symlinks when runner images use a different layout.
          if [ ! -x /usr/lib/llvm-18/bin/ld.lld ] && command -v ld.lld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld.lld)" /usr/lib/llvm-18/bin/ld.lld
          fi
          if [ ! -x /usr/lib/llvm-18/bin/ld ] && command -v ld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld)" /usr/lib/llvm-18/bin/ld
          fi
          ls -la /usr/lib/llvm-18/bin || true
          command -v ld.lld || true
          command -v ld || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Select Linux runner variant
        shell: bash
        run: |
          bash ./tools/select_linux_runner.sh "$LINUX_GTK_VARIANT"
          if [[ "$LINUX_GTK_VARIANT" == "gtk4" ]]; then
            echo "LINUX_GTK_ARTIFACT_SUFFIX=-gtk4" >> "$GITHUB_ENV"
          else
            echo "LINUX_GTK_ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Include LICENSE in bundle
        run: cp LICENSE build/linux/x64/release/bundle/

      - name: Stage Linux release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p artifacts/release
          tar -C build/linux/x64/release \
            -czf "artifacts/release/boomprint-linux-x64-$SEMVER.tar.gz" bundle

      - name: Upload Linux release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: artifacts/release/boomprint-linux-x64-${{ env.SEMVER }}.tar.gz
          if-no-files-found: error

      - name: Upload Linux build artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-linux-build${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          version: ${{ env.SEMVER }}
          filename: boomprint-linux-build${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          path: build/linux/x64/release/bundle/**
          append-max-detail-suffix: true
          retention-days: 7

  linux_gtk4:
    name: Linux GTK4 (prebuilt custom Flutter)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      FLUTTER_GTK4_REPOSITORY: https://github.com/richyo-codes/flutter.git
      FLUTTER_GTK4_BRANCH: 3.48.0-gtk4.issue94804.20260925
      FLUTTER_GTK4_SHA: 1e75e574e6a580fff095ebe83343276fd29df100
      FLUTTER_PREBUILT_ENGINE_VERSION: ffd16dd1cbc92510632687343958b952a705945f
      FLUTTER_STORAGE_BASE_URL: https://pub-79a02b1963fb4da6b5e4e4816e8b7146.r2.dev
      FLUTTER_ENGINE_STORAGE_BASE_URL: https://pub-79a02b1963fb4da6b5e4e4816e8b7146.r2.dev
      FLUTTER_LINUX_GTK: gtk4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Install Linux GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-4-dev liblzma-dev \
            libmimalloc-dev libpulse-dev libsecret-1-dev \
            libssl-dev curl git unzip xz-utils zip libglu1-mesa \
            libstdc++-12-dev libasound2-dev mpv libmpv-dev lld llvm

      - name: Set up Dart for FVM
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install FVM
        shell: bash
        run: |
          dart pub global activate fvm 4.2.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Verify requested Flutter branch
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git ls-remote "$FLUTTER_GTK4_REPOSITORY" "refs/heads/$FLUTTER_GTK4_BRANCH" | awk '{print $1}')"
          test "$actual_sha" = "$FLUTTER_GTK4_SHA"
          echo "Using $FLUTTER_GTK4_REPOSITORY branch $FLUTTER_GTK4_BRANCH at $actual_sha"

      - name: Register Flutter fork with FVM
        run: fvm fork add richyo-codes "$FLUTTER_GTK4_REPOSITORY"

      - name: Install pinned Flutter GTK4 SDK
        shell: bash
        run: |
          set -euo pipefail
          FLUTTER_STORAGE_BASE_URL="$FLUTTER_ENGINE_STORAGE_BASE_URL" \
            fvm install "richyo-codes/$FLUTTER_GTK4_SHA" --setup --skip-pub-get
          fvm use "richyo-codes/$FLUTTER_GTK4_SHA" --force --skip-setup --skip-pub-get

      - name: Verify Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .fvm/flutter_sdk rev-parse HEAD)" = "$FLUTTER_GTK4_SHA"
          test "$(cat .fvm/flutter_sdk/bin/cache/engine.stamp)" = "$FLUTTER_PREBUILT_ENGINE_VERSION"
          bash ./tools/install_gtk4_prebuilt_engine.sh .fvm/flutter_sdk
          fvm flutter --version
          fvm flutter precache --linux
          test -f .fvm/flutter_sdk/bin/cache/artifacts/engine/linux-x64-release/libflutter_linux_gtk4.so

      - name: Select GTK4 Linux runner
        run: bash ./tools/select_linux_runner.sh gtk4

      - name: Enable Linux desktop
        run: fvm flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: fvm flutter pub get

      - name: Build Linux GTK4 release
        run: fvm flutter build linux --release --linux-gtk=gtk4

      - name: Include LICENSE in bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle=build/linux-gtk4/x64/release/bundle
          test -f "$bundle/lib/libflutter_linux_gtk4.so"
          ldd "$bundle/boomprint" | tee "$RUNNER_TEMP/boomprint-gtk4-linkage.txt"
          grep -q 'libgtk-4.so' "$RUNNER_TEMP/boomprint-gtk4-linkage.txt"
          if grep -Eq 'libgtk-3.so|not found' "$RUNNER_TEMP/boomprint-gtk4-linkage.txt"; then
            echo "GTK4 bundle contains GTK3 or unresolved libraries." >&2
            exit 1
          fi
          cp LICENSE "$bundle/"
          printf 'App commit: %s\nFlutter branch: %s\nFlutter commit: %s\nEngine artifacts: %s\n' \
            "$GITHUB_SHA" "$FLUTTER_GTK4_BRANCH" "$FLUTTER_GTK4_SHA" \
            "$FLUTTER_PREBUILT_ENGINE_VERSION" > "$bundle/BUILD_INFO.txt"

      - name: Upload Linux GTK4 build artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-linux-build-gtk4-custom-flutter
          version: ${{ github.sha }}
          filename: boomprint-linux-build-gtk4-custom-flutter
          path: build/linux-gtk4/x64/release/bundle/**
          append-max-detail-suffix: true
          retention-days: 7

  linux_appimage:
    name: Linux AppImage
    # Temporarily disabled: current AppImage packaging path is unstable/broken.
    if: ${{ false }}
    runs-on: [ubuntu-latest]
    env:
      LINUX_GTK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_gtk_variant || 'gtk3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Git describe
        id: ghd
        shell: bash
        run: |
          echo "tag=$(git describe --always --tags --dirty)" >> "$GITHUB_OUTPUT"

      - name: Install AppImage build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ubuntu-keyring gnupg ca-certificates apt-transport-https
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtk-4-dev liblzma-dev \
            libmimalloc-dev libpulse-dev libsecret-1-dev libssl-dev curl git \
            unzip xz-utils zip libglu1-mesa libstdc++-12-dev libasound2-dev \
            mpv libmpv-dev software-properties-common lld llvm \
            squashfs-tools patchelf desktop-file-utils zsync python3-venv fakeroot
          python3 -m venv .venv-appimage
          . .venv-appimage/bin/activate
          python -m pip install --upgrade pip
          pip install appimage-builder
          echo "$GITHUB_WORKSPACE/.venv-appimage/bin" >> "$GITHUB_PATH"

          # Some Flutter/Dart toolchains look for linker binaries under llvm-18 path.
          if [ ! -x /usr/lib/llvm-18/bin/ld.lld ] && command -v ld.lld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld.lld)" /usr/lib/llvm-18/bin/ld.lld
          fi
          if [ ! -x /usr/lib/llvm-18/bin/ld ] && command -v ld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld)" /usr/lib/llvm-18/bin/ld
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Select Linux runner variant
        shell: bash
        run: |
          bash ./tools/select_linux_runner.sh "$LINUX_GTK_VARIANT"
          if [[ "$LINUX_GTK_VARIANT" == "gtk4" ]]; then
            echo "LINUX_GTK_ARTIFACT_SUFFIX=-gtk4" >> "$GITHUB_ENV"
          else
            echo "LINUX_GTK_ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Build AppImage
        run: appimage-builder --recipe appimage-builder.yml --skip-test

      - name: Version AppImage files
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in ./*.AppImage; do
            base=${f%.AppImage}
            mv "$f" "${base}-$SEMVER.AppImage"
          done
          for f in AppImage*.zsync; do
            base=${f%.zsync}
            mv "$f" "${base}-$SEMVER.zsync"
          done

      - name: Upload AppImage artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-appimage${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          version: ${{ env.SEMVER }}
          filename: boomprint-appimage${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          append-max-detail-suffix: true
          path: |
            ./*.AppImage
            AppImage*.zsync
          if-no-files-found: error
          retention-days: 7

  linux_flatpak:
    name: Linux Flatpak
    runs-on: [ubuntu-latest]
    env:
      LINUX_GTK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_gtk_variant || 'gtk3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Install Linux and container build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtk-4-dev \
            liblzma-dev libmimalloc-dev libpulse-dev libsecret-1-dev \
            libssl-dev curl git unzip xz-utils zip libglu1-mesa \
            libstdc++-12-dev libasound2-dev mpv libmpv-dev \
            software-properties-common lld llvm

          if ! command -v docker >/dev/null 2>&1 && ! command -v podman >/dev/null 2>&1; then
            sudo apt-get install -y podman
          fi

          command -v docker >/dev/null 2>&1 && docker --version || true
          command -v podman >/dev/null 2>&1 && podman --version || true

          if [ ! -x /usr/lib/llvm-18/bin/ld.lld ] && command -v ld.lld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld.lld)" /usr/lib/llvm-18/bin/ld.lld
          fi
          if [ ! -x /usr/lib/llvm-18/bin/ld ] && command -v ld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld)" /usr/lib/llvm-18/bin/ld
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Select Linux runner variant
        shell: bash
        run: |
          bash ./tools/select_linux_runner.sh "$LINUX_GTK_VARIANT"
          if [[ "$LINUX_GTK_VARIANT" == "gtk4" ]]; then
            echo "LINUX_GTK_ARTIFACT_SUFFIX=-gtk4" >> "$GITHUB_ENV"
          else
            echo "LINUX_GTK_ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Build Flatpak bundle
        run: bash ./tools/build_flatpak_container.sh --out-dir "$RUNNER_TEMP/boomprint-flatpak"

      - name: Stage Flatpak release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p artifacts/release
          cp "$RUNNER_TEMP/boomprint-flatpak/com.rnd.boomprint.flatpak" \
            "artifacts/release/boomprint-linux-x64-$SEMVER.flatpak"

      - name: Upload Flatpak release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak
          path: artifacts/release/boomprint-linux-x64-${{ env.SEMVER }}.flatpak
          if-no-files-found: error

      - name: Upload Flatpak artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-flatpak${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          version: ${{ env.SEMVER }}
          filename: boomprint-flatpak${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          append-max-detail-suffix: true
          path: ${{ runner.temp }}/boomprint-flatpak/com.rnd.boomprint.flatpak
          if-no-files-found: error
          retention-days: 7

  linux_deb:
    name: Linux Native DEB
    runs-on: [ubuntu-latest]
    env:
      LINUX_GTK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_gtk_variant || 'gtk3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Install Linux and Debian packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtk-4-dev \
            liblzma-dev libmimalloc-dev libpulse-dev libsecret-1-dev \
            libssl-dev curl git unzip xz-utils zip libglu1-mesa \
            libstdc++-12-dev libasound2-dev mpv libmpv-dev \
            software-properties-common lld llvm dpkg-dev

          if [ ! -x /usr/lib/llvm-18/bin/ld.lld ] && command -v ld.lld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld.lld)" /usr/lib/llvm-18/bin/ld.lld
          fi
          if [ ! -x /usr/lib/llvm-18/bin/ld ] && command -v ld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld)" /usr/lib/llvm-18/bin/ld
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Select Linux runner variant
        shell: bash
        run: |
          bash ./tools/select_linux_runner.sh "$LINUX_GTK_VARIANT"
          if [[ "$LINUX_GTK_VARIANT" == "gtk4" ]]; then
            echo "LINUX_GTK_ARTIFACT_SUFFIX=-gtk4" >> "$GITHUB_ENV"
          else
            echo "LINUX_GTK_ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Build Debian package
        run: bash ./tools/build_deb.sh --version "$SEMVER"

      - name: Upload Debian release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: build/packages/deb/*.deb
          if-no-files-found: error

      - name: Upload Debian artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-native-deb${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          version: ${{ env.SEMVER }}
          filename: boomprint-deb${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          append-max-detail-suffix: true
          path: build/packages/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  linux_rpm:
    name: Linux Native RPM
    runs-on: [ubuntu-latest]
    env:
      LINUX_GTK_VARIANT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.linux_gtk_variant || 'gtk3' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure Git LFS assets
        shell: bash
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Install Linux and RPM packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev libgtk-4-dev \
            liblzma-dev libmimalloc-dev libpulse-dev libsecret-1-dev \
            libssl-dev curl git unzip xz-utils zip libglu1-mesa \
            libstdc++-12-dev libasound2-dev mpv libmpv-dev \
            software-properties-common lld llvm rpm

          if [ ! -x /usr/lib/llvm-18/bin/ld.lld ] && command -v ld.lld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld.lld)" /usr/lib/llvm-18/bin/ld.lld
          fi
          if [ ! -x /usr/lib/llvm-18/bin/ld ] && command -v ld >/dev/null 2>&1; then
            sudo mkdir -p /usr/lib/llvm-18/bin
            sudo ln -sf "$(command -v ld)" /usr/lib/llvm-18/bin/ld
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Select Linux runner variant
        shell: bash
        run: |
          bash ./tools/select_linux_runner.sh "$LINUX_GTK_VARIANT"
          if [[ "$LINUX_GTK_VARIANT" == "gtk4" ]]; then
            echo "LINUX_GTK_ARTIFACT_SUFFIX=-gtk4" >> "$GITHUB_ENV"
          else
            echo "LINUX_GTK_ARTIFACT_SUFFIX=" >> "$GITHUB_ENV"
          fi

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Build RPM package
        run: bash ./tools/build_rpm.sh --version "$SEMVER"

      - name: Upload RPM release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: build/packages/rpm/**/*.rpm
          if-no-files-found: error

      - name: Upload RPM artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-native-rpm${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          version: ${{ env.SEMVER }}
          filename: boomprint-rpm${{ env.LINUX_GTK_ARTIFACT_SUFFIX }}
          append-max-detail-suffix: true
          path: build/packages/rpm/**/*.rpm
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64
    runs-on: [windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Enable Git long paths
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $longPaths = git config --global --get core.longpaths
          if ($longPaths -ne "true") {
            throw "Git long-path support was not enabled."
          }

      - name: Ensure Git LFS assets
        shell: pwsh
        run: |
          if (-not (Get-Command git-lfs -ErrorAction SilentlyContinue)) {
            throw "git-lfs is not available on this Windows runner."
          }
          git lfs install --local
          git lfs pull

      - name: Set SEMVER
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            semver="${GITHUB_REF_NAME#v}"
          else
            semver="$(git describe --always --tags --dirty 2>/dev/null || true)"
            if [[ -z "$semver" ]]; then
              semver="$(git rev-parse --short HEAD 2>/dev/null || true)"
            fi
            if [[ -z "$semver" ]]; then
              semver="0.0.0-unknown"
            fi
          fi
          echo "SEMVER=$semver" >> "$GITHUB_ENV"

      - name: Git describe
        id: ghd
        shell: pwsh
        run: |
          "tag=$(git describe --always --tags --dirty)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Include LICENSE in Release folder
        shell: pwsh
        run: Copy-Item -Path LICENSE -Destination build\windows\x64\runner\Release\LICENSE

      - name: Stage Windows release bundle
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "artifacts\release\boomprint-windows-x64-$env:SEMVER.zip"

      - name: Upload Windows release bundle artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-windows-bundle
          version: ${{ env.SEMVER }}
          filename: boomprint-windows-bundle
          append-max-detail-suffix: true
          path: build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 7

      # - name: Build Windows MSI
      #   if: runner.os == 'Windows'
      #   shell: pwsh
      #   run: |
      #     .\tool\build_msi.ps1 `
      #       -Configuration Release `
      #       -OutputDir build\windows\x64\installer `
      #       -ProductVersion "${{ env.SEMVER }}"

      # - name: Upload Windows MSI artifact
      #   if: runner.os == 'Windows'
      #   uses: richnetdesign/git-artifact-upload@v2
      #   with:
      #     name: boomprint-windows-msi
      #     version: ${{ env.SEMVER }}
      #     filename: boomprint-windows-msi
      #     append-max-detail-suffix: true
      #     path: build/windows/x64/installer/*.msi
      #     if-no-files-found: error
      #     retention-days: 7

      - name: Create Windows MSIX (unsigned)
        run: |
          flutter pub get
          dart run msix:create

      - name: Version MSIX file(s)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.msix | ForEach-Object {
            $dir = $_.DirectoryName
            $base = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            Rename-Item -Path $_.FullName -NewName "$base-$env:SEMVER.msix"
          }

      - name: Stage Windows release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\release | Out-Null
          Get-ChildItem -Recurse -Filter *.msix | Copy-Item -Destination artifacts\release

      - name: Upload Windows release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/release/*
          if-no-files-found: error

      - name: Upload Windows MSIX artifact
        uses: richnetdesign/git-artifact-upload@v2
        with:
          name: boomprint-windows-msix
          version: ${{ env.SEMVER }}
          filename: boomprint-windows-msix
          path: '**/*.msix'
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: [release_tag, android, linux, linux_flatpak, linux_deb, linux_rpm, windows]
    if: github.event_name == 'push' && needs.release_tag.outputs.is_semver == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber "${assets[@]}"
          else
            prerelease_args=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              prerelease_args=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --generate-notes "${prerelease_args[@]}"
          fi

